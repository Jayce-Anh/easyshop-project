version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - |
        set -euo pipefail
        curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
        unzip -o terraform.zip -d /usr/local/bin
        rm -f terraform.zip
      - terraform -version
  pre_build:
    on-failure: ABORT
    commands:
      - cd $CODEBUILD_SRC_DIR
      - terraform init -input=false
  build:
    on-failure: ABORT
    commands:
      - cd $CODEBUILD_SRC_DIR
      - |
        set -euo pipefail
        case "$TF_ACTION" in
          plan)
            echo "Checking formatting"
            terraform fmt -recursive
            echo "Validating"
            terraform validate
            echo "Planning"
            terraform plan -input=false -out=tfplan
            terraform show -no-color tfplan > tfplan.txt
            ;;
          apply)
            echo "Applying the plan approved in the previous stage"
            terraform apply -input=false -auto-approve tfplan
            ;;
          *)
            echo "Unknown TF_ACTION: $TF_ACTION (expected plan|apply)"
            exit 1
            ;;
        esac

artifacts:
  files:
    - '**/*'
  name: infra-artifacts
