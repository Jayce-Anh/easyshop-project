events {
  worker_connections 1024;
}

http {
  # Docker embedded DNS — resolve service names at request time
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;

    # Auth routes
    location /auth {
      set $auth_upstream http://auth-service:4000;
      proxy_pass $auth_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
    }

    # Product routes
    location /products {
      set $product_upstream http://product-service:5000;
      proxy_pass $product_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /singleProduct {
      set $product_upstream http://product-service:5000;
      proxy_pass $product_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Cart & Order routes
    location /cart {
      set $cart_upstream http://cart-service:6000;
      proxy_pass $cart_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
    }

    location /orders {
      set $cart_upstream http://cart-service:6000;
      proxy_pass $cart_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
    }

    # All other requests go to the frontend
    location / {
      set $frontend_upstream http://frontend:3000;
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
    }
  }
}
